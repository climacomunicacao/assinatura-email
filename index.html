<title>Assinatura de E-mail - Clima Comunicação</title>

<body style="margin:0;padding:20px;background:#f5f5f5;font-family:'Onest',Calibri,Arial,sans-serif;">

<!-- ASSINATURA -->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;max-width:580px;">

      <!-- Nome -->
      <p style="margin:0;padding:0;font-family:'Onest',Calibri,Arial,sans-serif;font-size:11pt;font-weight:bold;color:#262626;line-height:1.4;">Nome Sobrenome</p>

      <p style="margin:4px 0 0 0;padding:0;font-family:'Onest',Calibri,Arial,sans-serif;font-size:9pt;color:#262626;line-height:1.4;">11 5178 5177 | 41 2018 2108</p>

      <p style="margin:6px 0 0 0;padding:0;line-height:1;">
        <a href="https://climacomunicacao.com.br/?utm_source=email&utm_medium=assinatura&utm_campaign=assinatura_email" target="_blank" style="text-decoration:none;display:inline-block;margin-right:4px;">
